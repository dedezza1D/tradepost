name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782
        env:
          POSTGRES_USER: tradepost
          POSTGRES_PASSWORD: tradepost
          POSTGRES_DB: tradepost
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tradepost"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TP_DATABASE_URL: postgresql+asyncpg://tradepost:tradepost@localhost:5432/tradepost
      TP_TEST_DATABASE_URL: postgresql+asyncpg://tradepost:tradepost@localhost:5432/tradepost_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Migrations apply, roll back and re-apply on an empty database
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Models and migrations agree
        run: uv run alembic check
      - name: Tests
        run: |
          PGPASSWORD=tradepost psql -h localhost -U tradepost -c "CREATE DATABASE tradepost_test"
          uv run pytest
      - name: Dependency audit
        run: |
          uv export --no-dev --no-hashes --frozen --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --strict --progress-spinner off -r "$RUNNER_TEMP/requirements.txt"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:i18n
      - run: npm run typecheck:functions
      - run: npm run typecheck:workers
      - run: npm run test:edge
      - run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  e2e:
    # The production build in a real browser (phone and desktop) against the API, its migrations
    # and PostgreSQL, with the in-memory payment provider.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782
        env:
          POSTGRES_USER: tradepost
          POSTGRES_PASSWORD: tradepost
          POSTGRES_DB: tradepost_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tradepost"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql+asyncpg://tradepost:tradepost@localhost:5432/tradepost_e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --locked
        working-directory: backend
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the API image
        run: docker build -t tradepost-api:ci backend
      - name: Scan the image for known vulnerabilities
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7
          image --quiet --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 tradepost-api:ci
