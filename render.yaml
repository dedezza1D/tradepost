# Render Blueprint for the API. Secrets are marked sync: false and entered once in the
# dashboard; they never live in the repository.
services:
  - type: web
    name: tradepost-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    # Deploy a commit on main only after CI passed on it.
    autoDeployTrigger: checksPass
    envVars:
      - key: TP_ENV
        value: production
      - key: TP_COOKIE_SECURE
        value: "true"
      - key: TP_LOG_JSON
        value: "true"
      - key: TP_CLIENT_IP_HEADER
        value: x-client-ip
      - key: TP_STORAGE_BACKEND
        value: s3
      - key: TP_MEDIA_PUBLIC_BASE_URL
        value: /media
      - key: TP_PAYMENTS_SANDBOX
        value: "true"
      # Shared with the Cloudflare Pages proxy (PROXY_SECRET there); same value on both sides.
      - key: TP_PROXY_SECRET
        sync: false
      - key: TP_PUBLIC_ORIGIN
        sync: false
      - key: TP_DATABASE_URL
        sync: false
      - key: TP_S3_ENDPOINT_URL
        sync: false
      - key: TP_S3_BUCKET
        value: tradepost-media
      - key: TP_S3_ACCESS_KEY_ID
        sync: false
      - key: TP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: TP_STRIPE_SECRET_KEY
        sync: false
      - key: TP_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: TP_STRIPE_WEBHOOK_SECRET
        sync: false
      - key: TP_MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: TP_MERCADOPAGO_PUBLIC_KEY
        sync: false
      - key: TP_MERCADOPAGO_WEBHOOK_SECRET
        sync: false
