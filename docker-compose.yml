# Local development: PostgreSQL only. The API and the web app run on the host
# (see README), so code reloads instantly.
services:
  db:
    image: pgvector/pgvector:pg18@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782
    environment:
      POSTGRES_USER: tradepost
      POSTGRES_PASSWORD: tradepost
      POSTGRES_DB: tradepost
    ports:
      - "5433:5432"
    volumes:
      - db-data-pg18-vector:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradepost"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db-data-pg18-vector:
