[project]
name = "tradepost"
version = "0.1.0"
description = "Marketplace backend: listings, search, cart, checkout with Stripe and Mercado Pago (test mode), orders and reviews."
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pillow>=11.0",
    "python-multipart>=0.0.18",
    "boto3>=1.35",
    "structlog>=24.4",
    "httpx>=0.28",
    "stripe>=11.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "testcontainers[postgres]>=4.9",
    "ruff>=0.8",
    "mypy>=1.13",
    "boto3-stubs[s3]>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradepost"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT"]
ignore = ["S101", "B008", "RUF012", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"migrations/**" = ["E501"]
# Evaluation data: long literal titles and a seeded generator.
"eval/**" = ["E501", "S311"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["tradepost", "eval"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "stripe.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra"
